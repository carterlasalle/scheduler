    test -short -p 1 -count=1 ./... all packages ok, golangci-lint 0 issues, gitreins
    guard PASS 4/4'
  - 'REOPEN 2026-08-05 (PM review): starvation boost ordering must be starvation-age
    first, priority second. Live proof of the residual bug: dexdat-core/imhotep/mythos/
    rethinkdb/eduos.dexdat.com.co (all priority=5, cooldown<=3600s) get FAIRNESS-boosted
    every eval yet received ZERO spawn attempts for 25-34h (last ticks: dexdat-core
