    read/write it
  - 'Regression tests exist and pass: TestSGAP001_Starvation_NamespacePack, TestSGAP001_StarvationBoundary
    (59min NOT boosted), TestSGAP001_Backoff_NamespacePack, TestSGAP001_Starvation_FlatPick,
    TestSGAP001_Backoff_FlatPick, TestSGAP001_ConsecutiveFailuresRoundTrip, TestSpawn_GatewayFailureIncrementsConsecutiveFailures,
    TestSpawn_GatewaySuccessResetsConsecutiveFailures'
