{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{.Title}} · Coding Hermes Fleet</title>
<script src="/static/htmx.min.js"></script>
<style>
/* ── Shared design system (Linear-inspired dark dashboard) ── */
:root{
--bg:#0b0c0d;--panel:#0f1011;--surface:#191a1b;--surface2:#202124;
--fg:#f7f8f8;--text:#d0d6e0;--muted:#8a8f98;--faint:#62666d;
--accent:#7170ff;--accent-hi:#828fff;--accent-bg:rgba(113,112,255,0.12);
--green:#27a644;--emerald:#10b981;--red:#f85149;--yellow:#d2991d;
--border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.12);
--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);
--sidebar-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-optical-sizing:auto;font-feature-settings:'cv01','ss03';background:var(--bg);color:var(--fg);display:flex;min-height:100vh}
a{color:var(--accent-hi);text-decoration:none}
a:hover{text-decoration:underline}
code, .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.85em}

/* Sidebar */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;letter-spacing:-0.01em;color:var(--fg);margin-bottom:26px;padding:0 8px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;font-size:13px;color:#fff;flex-shrink:0}
.side-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);padding:16px 8px 6px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav a{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:0.88rem;font-weight:510;padding:8px 10px;border-radius:7px;transition:background 160ms var(--ease-out),color 160ms var(--ease-out)}
.side-nav a .ic{width:18px;text-align:center;opacity:0.8}
.side-nav a:hover{background:var(--surface);color:var(--fg);text-decoration:none}
.side-nav a.active{background:var(--accent-bg);color:var(--accent-hi)}
.side-nav a.active .ic{opacity:1}

/* Main content */
.main{flex:1;min-width:0;padding:24px 28px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:4px}
h1{font-size:1.35rem;font-weight:590;letter-spacing:-0.02em;line-height:1.1}
h2{font-size:0.95rem;font-weight:590;letter-spacing:-0.01em;margin:28px 0 12px;color:var(--fg)}
.meta{color:var(--muted);font-size:0.8rem;margin-bottom:20px}
.actions{display:flex;gap:8px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;opacity:0;transform:translateY(8px);transition:opacity 340ms var(--ease-out),transform 340ms var(--ease-out)}
body.ready .card{opacity:1;transform:translateY(0)}
.card:nth-child(2){transition-delay:40ms}.card:nth-child(3){transition-delay:80ms}.card:nth-child(4){transition-delay:120ms}.card:nth-child(5){transition-delay:160ms}.card:nth-child(6){transition-delay:200ms}
.card .label{color:var(--muted);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em}
.card .value{font-size:1.5rem;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.card .sub{color:var(--muted);font-size:0.78rem;margin-top:4px}

/* Bars */
.budget-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:22px}
.budget-fill{height:8px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--accent));border-radius:5px;margin-top:8px;transition:width .3s var(--ease-out)}
.budget-label{display:flex;justify-content:space-between;font-size:0.8rem;margin-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{background:var(--surface2);border-radius:4px;height:6px;width:88px;margin-bottom:3px;overflow:hidden}
.prog-fill{height:6px;background:var(--accent);border-radius:4px;transition:width .3s var(--ease-out)}
.urgency-bar{display:inline-block;height:6px;background:var(--accent);border-radius:3px;margin-right:6px;vertical-align:middle;max-width:80px}

/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.84rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
th{background:var(--panel);color:var(--muted);font-weight:590;text-transform:uppercase;font-size:0.66rem;letter-spacing:0.06em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr{transition:background 160ms var(--ease-out)}
@media(hover:hover) and (pointer:fine){tbody tr:hover{background:var(--surface2)}}
td .num, .num{font-variant-numeric:tabular-nums}

/* Status */
.status-ok{color:var(--emerald)}.status-fail{color:var(--red)}.status-running{color:var(--accent-hi)}.status-timeout{color:var(--yellow)}.status-warn{color:var(--yellow)}
.running-dot{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:6px;animation:pulse 2.4s ease-in-out infinite;box-shadow:0 0 0 3px var(--accent-bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.fail-flag{color:var(--red);font-weight:600}
.spark{display:block;margin-top:2px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:0.7rem;font-weight:510;border:1px solid var(--border-hi);color:var(--text)}

/* Utilities */
.disabled{opacity:0.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--border-hi);color:var(--text);font-size:0.78rem;font-weight:510}
.pill.ok{color:var(--emerald);border-color:rgba(16,185,129,0.35)}.pill.fail{color:var(--red);border-color:rgba(248,81,73,0.35)}.pill.warn{color:var(--yellow);border-color:rgba(210,153,29,0.4)}.pill.run{color:var(--accent-hi);border-color:rgba(113,112,255,0.4)}
.htmx-indicator{color:var(--muted);font-size:0.7rem;margin-left:8px;display:none}
.htmx-request .htmx-indicator{display:inline}

/* Responsive */
@media(max-width:820px){
  body{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);padding:14px}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side-label{display:none}
  .main{padding:16px}
  table{font-size:0.76rem}th,td{padding:8px 10px}
}
@media (prefers-reduced-motion: reduce){.card{opacity:1;transform:none;transition:none}.running-dot{animation:none}}
@media (prefers-reduced-transparency: reduce){.sidebar,.table-wrap{background:var(--panel)}}
</style>
</head>
<body>
{{end}}

{{define "sidebar"}}
<aside class="sidebar">
<a class="brand" href="/"><span class="logo">◈</span> Coding Hermes</a>
<div class="side-label">Fleet</div>
<nav class="side-nav">
<a href="/" {{if eq . "overview"}}class="active"{{end}}><span class="ic">◉</span> Overview</a>
<a href="/queue" {{if eq . "queue"}}class="active"{{end}}><span class="ic">≋</span> Queue</a>
<a href="/ticks" {{if eq . "ticks"}}class="active"{{end}}><span class="ic">⧉</span> Tick History</a>
<a href="/health" {{if eq . "health"}}class="active"{{end}}><span class="ic">♥</span> Health</a>
</nav>
</aside>
{{end}}

{{define "ready_js"}}<script>
// Entrance stagger: fade/slide stat cards in once on first load.
(function () {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { document.body.classList.add('ready'); return; }
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { document.body.classList.add('ready'); });
  });
})();
</script>
{{end}}
